<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag & Drop Debug — Issue #105</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
    h1 { font-size: 18px; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 16px; }

    #dropzone {
      width: 100%; height: 220px; border: 2px dashed #555; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #888; transition: all 0.15s; cursor: pointer;
    }
    #dropzone.dragover { border-color: #4fc3f7; background: rgba(79,195,247,0.08); color: #4fc3f7; }
    #dropzone.drop { border-color: #66bb6a; background: rgba(102,187,106,0.08); }

    #log {
      margin-top: 16px; padding: 12px; background: #111; border: 1px solid #333;
      border-radius: 8px; font-family: 'SF Mono', 'Menlo', monospace; font-size: 13px;
      white-space: pre-wrap; word-break: break-all; max-height: 70vh; overflow-y: auto;
      line-height: 1.5;
    }
    .entry { border-bottom: 1px solid #222; padding: 8px 0; }
    .entry:last-child { border-bottom: none; }
    .label { color: #4fc3f7; font-weight: 600; }
    .ok { color: #66bb6a; }
    .warn { color: #ffa726; }
    .fail { color: #ef5350; }
    .dim { color: #666; }
    #clear { margin-top: 8px; padding: 6px 14px; background: #333; border: 1px solid #555; color: #ccc; border-radius: 6px; cursor: pointer; font-size: 13px; }
    #clear:hover { background: #444; }
  </style>
</head>
<body>
  <h1>Drag & Drop Debug Page</h1>
  <p class="subtitle">Issue #105 — Chrome 真实 OS 拖拽调试 | DataTransfer API 行为探测</p>

  <div id="dropzone">拖放文件到这里（.md / .mdpkg / 任意文件）</div>
  <button id="clear">清除日志</button>
  <div id="log"></div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const log = document.getElementById('log');

    let entryCounter = 0;

    document.getElementById('clear').addEventListener('click', () => {
      log.innerHTML = '';
      entryCounter = 0;
      dropzone.textContent = '拖放文件到这里（.md / .mdpkg / 任意文件）';
      dropzone.className = '';
    });

    // --- drag events on the whole page ---
    document.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.add('dragover');
    });

    document.addEventListener('dragleave', (e) => {
      // Only reset when leaving the window
      if (e.relatedTarget === null) {
        dropzone.classList.remove('dragover');
      }
    });

    document.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      dropzone.classList.remove('dragover');
      dropzone.classList.add('drop');
      setTimeout(() => dropzone.classList.remove('drop'), 400);

      const idx = ++entryCounter;
      const lines = [];

      const add = (text, cls = '') => {
        lines.push(`<span class="${cls}">${esc(text)}</span>`);
      };

      add(`--- Drop Event #${idx} — ${new Date().toLocaleTimeString()} ---`, 'label');

      const dt = e.dataTransfer;

      // 1. Basic info
      add(`dataTransfer.types: [${Array.from(dt.types).join(', ')}]`);
      add(`dataTransfer.effectAllowed: ${dt.effectAllowed}`);
      add(`dataTransfer.dropEffect: ${dt.dropEffect}`);

      // 2. Items count
      const items = dt.items;
      add(`dataTransfer.items.length: ${items.length}`);

      if (items.length === 0) {
        add('NO ITEMS — dataTransfer.items is empty!', 'fail');
      }

      // 3. Probe each item
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        add(`\n  [Item ${i}] kind="${item.kind}" type="${item.type}"`, 'label');

        // getAsFile()
        try {
          const file = item.getAsFile();
          if (file) {
            add(`  getAsFile(): ${file.name} (${formatSize(file.size)}, type="${file.type}")`, 'ok');
          } else {
            add(`  getAsFile(): null`, 'warn');
          }
        } catch (err) {
          add(`  getAsFile(): threw — ${err}`, 'fail');
        }

        // webkitGetAsEntry()
        try {
          const entry = item.webkitGetAsEntry();
          if (entry) {
            add(`  webkitGetAsEntry(): kind="${entry.kind}" name="${entry.name}" isFile=${entry.isFile} isDirectory=${entry.isDirectory}`, 'ok');
          } else {
            add(`  webkitGetAsEntry(): null`, 'warn');
          }
        } catch (err) {
          add(`  webkitGetAsEntry(): threw — ${err}`, 'fail');
        }

        // getAsFileSystemHandle()
        try {
          if (typeof item.getAsFileSystemHandle === 'function') {
            const handle = await item.getAsFileSystemHandle();
            if (handle) {
              add(`  getAsFileSystemHandle(): kind="${handle.kind}" name="${handle.name}"`, 'ok');
            } else {
              add(`  getAsFileSystemHandle(): null`, 'warn');
            }
          } else {
            add(`  getAsFileSystemHandle(): not supported (method undefined)`, 'dim');
          }
        } catch (err) {
          add(`  getAsFileSystemHandle(): threw — ${err}`, 'fail');
        }
      }

      // 4. Check if items survived after async probes
      add(`\n  --- Post-Await Check ---`, 'label');
      add(`  items.length after await: ${items.length}`);
      if (items.length === 0) {
        add(`  ⚠ items CLEARED after async probes (Chrome GC behavior)`, 'warn');
      } else {
        // Try accessing again
        try {
          const f = items[0]?.getAsFile();
          add(`  items[0] still accessible: ${f ? f.name : 'null'}`, f ? 'ok' : 'warn');
        } catch (err) {
          add(`  items[0] access threw: ${err}`, 'fail');
        }
      }

      // 5. files fallback
      add(`\n  --- Files List ---`, 'label');
      const files = dt.files;
      add(`  dataTransfer.files.length: ${files.length}`);
      for (let i = 0; i < files.length; i++) {
        add(`  file[${i}]: ${files[i].name} (${formatSize(files[i].size)}, type="${files[i].type}")`);
      }

      // Render
      add('', '');
      const entry = document.createElement('div');
      entry.className = 'entry';
      entry.innerHTML = lines.join('\n');
      log.prepend(entry);
    });

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + ' B';
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
      return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
