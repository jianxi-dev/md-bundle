name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      - name: Typecheck (strict)
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @md-bundle/web build

      - name: Install Playwright browsers
        run: pnpm --filter @md-bundle/web exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter @md-bundle/web test:e2e

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: apps/web/test-results/
          if-no-files-found: ignore

  # vendor 漂移检测：比较本仓库 vendor/mdpkg-web.js 与上游最新构建产物是否一致
  vendor-drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout md-bundle
        uses: actions/checkout@v4

      - name: Compute local vendor sha256
        id: local-hash
        run: |
          LOCAL_SHA=$(sha256sum apps/web/vendor/mdpkg-web.js | awk '{print $1}')
          echo "sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          echo "本地 vendor sha256: $LOCAL_SHA"

      - name: Checkout upstream mdpkg
        uses: actions/checkout@v4
        with:
          repository: jianxi-dev/mdpkg
          path: upstream
          ref: main
          fetch-depth: 1

      - name: Compute upstream bundle sha256
        id: upstream-hash
        run: |
          UP_SHA=$(sha256sum upstream/packages/mdpkg/web/mdpkg-web.js | awk '{print $1}')
          echo "sha=$UP_SHA" >> "$GITHUB_OUTPUT"
          echo "上游 bundle sha256: $UP_SHA"

      - name: Compare sha256
        run: |
          LOCAL="${{ steps.local-hash.outputs.sha }}"
          UPSTREAM="${{ steps.upstream-hash.outputs.sha }}"
          if [[ "$LOCAL" != "$UPSTREAM" ]]; then
            echo "::error::vendor 过期！本地 vendor/mdpkg-web.js 与上游不一致。"
            echo "::error::本地: $LOCAL"
            echo "::error::上游: $UPSTREAM"
            echo "::error::请运行: bash scripts/sync-vendor.sh <上游commit>"
            exit 1
          fi
          echo "✓ vendor 与上游一致 ($LOCAL)"