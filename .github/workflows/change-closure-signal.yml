name: Change closure signal

# Layer 1（确定性信号）：当合并的 PR 关闭某 change 的最后一张子票时，
# 给该 PR 打 `change-close-pending` 标签 + 评论。
# change-workflow 会话启动时消费该标签并自动执行 G4 收尾（Layer 2a）。
# 设计见 .opencode/skills/change-workflow/SKILL.md「会话启动：消费合并信号」。
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  signal:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Detect completed changes and emit signal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          echo "PR #$PR merged — detecting change closure…"

          # 该 PR 关闭的 issue（GitHub 解析 PR body/commits 中的 fixes/closes）
          CLOSED=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number' 2>/dev/null || true)

          # 从子票标题 [change=<名>/<task>] 提取 change 名
          CHANGES=""
          for n in $CLOSED; do
            T=$(gh issue view "$n" --repo "$REPO" --json title --jq .title 2>/dev/null || echo "")
            case "$T" in
              \[change=*/*)
                c="${T#\[change=}"; c="${c%%/*}"
                CHANGES="$CHANGES $c"
                ;;
            esac
          done
          CHANGES=$(printf '%s\n' $CHANGES | sort -u | grep -v '^$' || true)
          if [ -z "$CHANGES" ]; then
            echo "无 [change=…] 子票关闭，跳过信号"
            exit 0
          fi

          # 确保信号标签存在（幂等）
          gh label create change-close-pending --repo "$REPO" \
            --color FBCA04 \
            --description "待 change-workflow 会话启动消费（G4 收尾）" \
            --force >/dev/null 2>&1 || true

          for c in $CHANGES; do
            # 该 change 是否还有 open 子票（标题前缀 [change=<c>/）
            REMAIN=$(gh issue list --repo "$REPO" --state open --label ready-for-agent --limit 200 \
              --json title \
              --jq "[.[] | select(.title | startswith(\"[change=$c/\"))] | length")
            if [ "$REMAIN" -eq 0 ]; then
              echo "change '$c': 无剩余 open 子票 → 打 change-close-pending"
              gh pr edit "$PR" --repo "$REPO" --add-label change-close-pending
              gh pr comment "$PR" --repo "$REPO" --body "🔔 **change-close-pending**：change \`$c\` 的子票已全部关闭（本 PR 合并）。

          change-workflow 会话启动时将自动执行 G4 收尾（sync → validate --strict → archive → 看板 Done → 关闭 spec issue）。无需人工提醒。"
            else
              echo "change '$c': 仍有 $REMAIN 张 open 子票，不打信号"
            fi
          done
